SHORTDESC='Free self-hosted restaurant POS and management (runs in Docker)'
LONGDESC=' Restaurant POS is a free, open-source restaurant POS with tables, a kitchen
 display, reservations, QR ordering and loyalty. This package installs a systemd
 service that runs the published, version-pinned Restaurant POS containers and a
 PostgreSQL database with Docker Compose, keeping all data in Docker volumes on
 this machine. Open http://localhost:1995 after installing.
 .
 Settings are in /etc/restaurant-pos/restaurant-pos.env. Upgrade with apt;
 back up your data first.'
